<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hash Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
/* Layout: one column of game cabinets on graph paper, the twin of the Fourier Arcade.
   Ink on cool paper; vermilion leads here (the colour of scrambled bits in the course),
   teal is kept for the player's own mark. */
:root {
  --paper: #EDF0F4;
  --grid: #DCE2EA;
  --card: #FBFCFD;
  --ink: #141B2B;
  --muted: #586377;
  --line: #C5CDD8;
  --off: #E1E6ED;
  --hot: #D93A22;
  --wave: #0B7A85;
  --ok: #1F7F52;
  --acc: var(--hot);
  --f-display: "ZCOOL QingKe HuangYou", "PingFang SC", "Microsoft YaHei", sans-serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0C111D; --grid: #151C2C; --card: #141B2B; --ink: #E7ECF5;
    --muted: #95A1B8; --line: #2B3650; --off: #1F2940;
    --hot: #FF6A48; --wave: #42C4CE; --ok: #4CC38A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0C111D; --grid: #151C2C; --card: #141B2B; --ink: #E7ECF5;
  --muted: #95A1B8; --line: #2B3650; --off: #1F2940;
  --hot: #FF6A48; --wave: #42C4CE; --ok: #4CC38A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.6;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 0 18px; }
h1, h2 { font-family: var(--f-display); font-weight: 400; text-wrap: balance; margin: 0; }
p { margin: 0; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.nav { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--paper) 90%, transparent);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.nav .wrap { display: flex; gap: 6px; padding-top: 8px; padding-bottom: 8px; align-items: center; }
.nav button { height: 32px; padding: 0 10px; font-size: 13px; background: transparent; border: 1.5px solid var(--line); border-radius: 3px; cursor: pointer; white-space: nowrap; }
.nav button.jump { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.nav button.jump.full { background: var(--acc); border-color: var(--acc); color: #fff; }
.nav .stars { font-family: var(--f-mono); font-size: 13px; font-weight: 600; padding: 0 4px; white-space: nowrap; }

.top { padding: 36px 0 4px; display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; color: var(--muted); }
h1 { font-size: clamp(54px, 15vw, 104px); line-height: .98; letter-spacing: .01em; }
h1 span { color: var(--acc); }
.lead { max-width: 36em; font-size: 17px; }
#heroWave { height: 64px; }

.game { margin-top: 52px; padding-top: 18px; border-top: 3px solid var(--ink); scroll-margin-top: 60px; display: flex; flex-direction: column; gap: 14px; }
.game-head { display: grid; grid-template-columns: auto 1fr; column-gap: 12px; align-items: baseline; }
.tag { font-family: var(--f-mono); font-weight: 600; font-size: 14px; color: var(--acc); border: 1.5px solid var(--acc); border-radius: 3px; padding: 0 7px; }
.game-head h2 { font-size: 34px; line-height: 1.15; }
.how { grid-column: 1 / -1; margin-top: 6px; max-width: 40em; }
.goals { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); }
.goals li { display: grid; grid-template-columns: 20px 1fr; align-items: baseline; }
.goals li::before { content: "☆"; font-size: 15px; }
.goals li.done { color: var(--ink); font-weight: 700; }
.goals li.done::before { content: "★"; color: var(--acc); }

.bench { background: var(--card); border: 1.5px solid var(--ink); border-radius: 4px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.cap { font-size: 13px; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { min-height: 40px; padding: 7px 14px; cursor: pointer; background: var(--acc); color: #fff; border: 0; border-radius: 4px; font-weight: 700; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); font-weight: 500; }
.btn[hidden] { display: none; }
.seg { display: flex; border: 1.5px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { flex: 1; min-height: 38px; padding: 6px 4px; background: transparent; border: 0; border-left: 1.5px solid var(--line); cursor: pointer; font-size: 13px; white-space: nowrap; }
.seg button:first-child { border-left: 0; }
.seg button.on { background: var(--ink); color: var(--paper); }
.seg button.won::after { content: " ★"; color: var(--acc); }
.seg button.on.won::after { color: var(--paper); }
canvas { display: block; width: 100%; }
input[type="range"] { width: 100%; accent-color: var(--acc); margin: 0; height: 26px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 14px; height: 0; margin-right: 5px; border-top: 2.5px solid var(--sw); vertical-align: 3px; }
.legend .dash::before { border-top-style: dashed; }
.big { font-family: var(--f-mono); font-weight: 600; font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.big small { font-family: var(--f-body); font-weight: 400; font-size: 14px; color: var(--muted); }
.meter { position: relative; height: 12px; background: var(--off); border-radius: 2px; overflow: hidden; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--acc); transition: width .15s; }
.note { font-size: 15px; border-left: 4px solid var(--acc); padding-left: 12px; }
.note[hidden] { display: none; }
.note.bad { border-left-color: var(--hot); }

.oscs { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 18px; }
.osc { display: flex; flex-direction: column; gap: 2px; }
.osc .name { font-size: 13px; font-weight: 700; }
.osc label { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }

.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opts button { padding: 8px 8px 4px; background: var(--paper); border: 1.5px solid var(--line); border-radius: 4px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; text-align: left; }
.opts button:not(:disabled):hover { border-color: var(--ink); }
.opts button:disabled { cursor: default; }
.opts button canvas { height: 84px; }
.opts button .lab { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.opts button.right { border-color: var(--ok); box-shadow: inset 0 0 0 2px var(--ok); }
.opts button.wrong { border-color: var(--hot); opacity: .6; }

.cells { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.cells button { aspect-ratio: 1; min-width: 0; padding: 0; background: var(--paper); border: 1.5px solid var(--line); border-radius: 4px; cursor: pointer;
  font-family: var(--f-mono); font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
.cells button:not(:disabled):hover { border-color: var(--ink); }
.cells button:disabled { cursor: default; }
.cells button small { font-size: 10px; color: var(--muted); }
.cells button.miss { background: var(--off); color: var(--muted); border-style: dashed; }
.cells button.hit { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 600; }
.cells button.hit small { color: #fff; }
.cells button.reveal { border: 2px solid var(--hot); color: var(--hot); }

.pad { position: relative; width: 100%; max-width: 440px; align-self: center; }
.pad canvas { aspect-ratio: 1; height: auto; background: var(--paper); border: 1.5px dashed var(--line); border-radius: 4px; touch-action: none; cursor: crosshair; }

.end { margin: 56px 0 0; padding: 20px 0 48px; border-top: 3px solid var(--ink); display: flex; flex-direction: column; gap: 8px; }
.end .fine { font-size: 13px; color: var(--muted); max-width: 44em; }
.stats { display: flex; flex-wrap: wrap; gap: 2px 16px; font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 600; }
.nav #soundBtn.off { color: var(--muted); text-decoration: line-through; }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 10; max-width: calc(100% - 36px);
  background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 4px; font-weight: 700; font-size: 15px;
  opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.show { opacity: 1; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.7); } 100% { transform: scale(1); } }
.goals li.just::before { display: inline-block; animation: pop .6s ease; }
.end h2 { font-size: 34px; }
.records { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; margin: 4px 0 6px; font-size: 14px; }
.records dt { font-weight: 700; }
.records dd { margin: 0; color: var(--muted); font-variant-numeric: tabular-nums; }
.end.cleared h2 { color: var(--acc); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* hash arcade additions */
.bits32 { display: grid; grid-template-columns: repeat(32, 1fr); gap: 2px; }
.bits32 i { aspect-ratio: 1; background: var(--off); border-radius: 1px; }
.bits32 i.one { background: var(--ink); }
.bits32 i.lead { background: var(--acc); }
.bits32 i.need { box-shadow: 0 3px 0 var(--ink); }
.hex { font-family: var(--f-mono); font-size: 13px; line-height: 1.6; word-break: break-all; }
.hex b { color: var(--acc); font-weight: 600; }
.try { font-family: var(--f-mono); font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
input[type="text"], input[type="number"] { width: 100%; padding: 10px 12px; font-size: 16px; background: var(--paper); border: 1.5px solid var(--line); border-radius: 4px; }
input[type="text"]:focus, input[type="number"]:focus { border-color: var(--ink); outline: none; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 13px; color: var(--muted); }
.readout { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px 16px; }
.readout div { display: flex; flex-direction: column; }
.readout .k { font-size: 12px; color: var(--muted); }
.readout .v { font-family: var(--f-mono); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.btn:disabled { opacity: .5; cursor: default; }
.betrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
.gridpad { width: 100%; max-width: 360px; align-self: center; }
.gridpad canvas { aspect-ratio: 1; height: auto; }
.legend .teal { --sw: var(--wave); }
</style>
</head>
<body>
<nav class="nav" aria-label="Games"><div class="wrap">
  <button class="jump" type="button" data-jump="dig" data-i18n="nav1"></button>
  <button class="jump" type="button" data-jump="bet" data-i18n="nav2"></button>
  <span class="stars" id="starCount"></span>
  <button type="button" id="soundBtn">♪</button>
  <button type="button" id="langBtn"></button>
</div></nav>

<main class="wrap">
<header class="top">
  <div class="eyebrow" data-i18n="eyebrow"></div>
  <h1 data-i18n-html="title"></h1>
  <p class="lead" data-i18n="lead"></p>
</header>

<!-- ================= 1 ================= -->
<section class="game" id="dig">
  <div class="game-head"><span class="tag">H1</span><h2 data-i18n="g1title"></h2><p class="how" data-i18n="g1how"></p></div>
  <ul class="goals"><li data-goal="dig0" data-i18n="g1goal0"></li><li data-goal="dig1" data-i18n="g1goal1"></li><li data-goal="dig2" data-i18n="g1goal2"></li></ul>
  <div class="bench">
    <div class="field"><label for="digBase" data-i18n="digBase"></label><input type="text" id="digBase" maxlength="60" autocomplete="off" spellcheck="false"></div>
    <div class="field"><span class="cap" data-i18n="digLevel"></span><div class="seg" id="digSeg"></div></div>
    <span class="cap" id="digOdds"></span>
    <div class="try" id="digTry"></div>
    <div class="bits32" id="digBits" aria-hidden="true"></div>
    <div class="legend"><span style="--sw:var(--acc)" data-i18n="legLead"></span><span style="--sw:var(--ink)" data-i18n="legOne"></span><span style="--sw:var(--off)" data-i18n="legZero"></span></div>
    <div class="hex" id="digHex"></div>
    <div class="readout">
      <div><span class="k" data-i18n="digTries"></span><span class="v" id="digN"></span></div>
      <div><span class="k" data-i18n="digZeros"></span><span class="v" id="digZ"></span></div>
      <div><span class="k" data-i18n="digBestNow"></span><span class="v" id="digB"></span></div>
      <div><span class="k" data-i18n="digRate"></span><span class="v" id="digR"></span></div>
    </div>
    <p class="note" id="digNote" hidden></p>
    <div class="row">
      <button class="btn ghost" type="button" id="digOnce" data-i18n="digOnce"></button>
      <button class="btn" type="button" id="digAuto"></button>
      <button class="btn ghost" type="button" id="digReset" data-i18n="digReset"></button>
    </div>
    <div class="stats"><span id="digRec"></span></div>
  </div>
</section>

<!-- ================= 2 ================= -->
<section class="game" id="bet">
  <div class="game-head"><span class="tag">H2</span><h2 data-i18n="g2title"></h2><p class="how" data-i18n="g2how"></p></div>
  <ul class="goals"><li data-goal="bet0" data-i18n="g2goal0"></li><li data-goal="bet1" data-i18n="g2goal1"></li><li data-goal="bet2" data-i18n="g2goal2"></li></ul>
  <div class="bench">
    <div class="seg" id="betSeg"></div>
    <p id="betAsk" style="font-weight:700"></p>
    <span class="cap" data-i18n="betTip"></span>
    <div class="betrow">
      <div class="field"><label for="betInput" data-i18n="betLabel"></label><input type="number" id="betInput" min="1" step="1" inputmode="numeric"></div>
      <button class="btn" type="button" id="betGo" data-i18n="betGo"></button>
    </div>
    <div class="gridpad" id="betGridWrap"><canvas id="betGrid" role="img" aria-label="Slots filling up"></canvas></div>
    <span class="cap" id="betGridCap"></span>
    <canvas id="betHist" style="height:150px" role="img" aria-label="How many throws each race took" hidden></canvas>
    <div class="legend" id="betLegend" hidden><span style="--sw:var(--muted)" data-i18n="legRaces"></span><span style="--sw:var(--acc)" data-i18n="legAvg"></span><span class="dash teal" data-i18n="legBet"></span></div>
    <p class="note" id="betNote" hidden></p>
    <div class="row"><button class="btn ghost" type="button" id="betNew" data-i18n="betNew"></button></div>
    <div class="stats"><span id="betRec"></span></div>
  </div>
</section>

<section class="end" id="end">
  <h2 id="endTitle"></h2>
  <p class="num" id="endStars"></p>
  <dl class="records" id="records"></dl>
  <p class="fine" data-i18n="fine"></p>
</section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/*CORE-START*/
const K256 = new Uint32Array([
  0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
const W256 = new Uint32Array(64);
const ENC = new TextEncoder();
function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }
/* the same SHA-256 as hash_demo.c: pad, expand, 64 rounds, add back */
function sha256(bytes) {
  const len = bytes.length, total = Math.ceil((len + 9) / 64) * 64;
  const buf = new Uint8Array(total);
  buf.set(bytes); buf[len] = 0x80;
  const dv = new DataView(buf.buffer);
  dv.setUint32(total - 8, Math.floor(len / 0x20000000));
  dv.setUint32(total - 4, (len * 8) >>> 0);
  let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a, h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
  const m = W256;
  for (let off = 0; off < total; off += 64) {
    for (let i = 0; i < 16; i++) m[i] = dv.getUint32(off + i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = rotr(m[i-15], 7) ^ rotr(m[i-15], 18) ^ (m[i-15] >>> 3);
      const s1 = rotr(m[i-2], 17) ^ rotr(m[i-2], 19) ^ (m[i-2] >>> 10);
      m[i] = (m[i-16] + s0 + m[i-7] + s1) >>> 0;
    }
    let a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K256[i] + m[i]) >>> 0;
      const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0;
    h4 = (h4 + e) >>> 0; h5 = (h5 + f) >>> 0; h6 = (h6 + g) >>> 0; h7 = (h7 + h) >>> 0;
  }
  const out = new Uint8Array(32), odv = new DataView(out.buffer);
  [h0, h1, h2, h3, h4, h5, h6, h7].forEach((v, i) => odv.setUint32(i * 4, v));
  return out;
}
function hashText(s) { return sha256(ENC.encode(s)); }
function hexBytes(b) { let s = ''; for (let i = 0; i < b.length; i++) s += b[i].toString(16).padStart(2, '0'); return s; }
function mulberry(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---- Dig: proof of work ---- */
function leadingZeroBits(h) {
  let n = 0;
  for (let i = 0; i < h.length; i++) {
    if (h[i] === 0) { n += 8; continue; }
    n += Math.clz32(h[i]) - 24; break;
  }
  return n;
}
function digText(base, nonce) { return base + ' #' + nonce; }
/* try nonces start .. start+count-1; stop at the first one that reaches `target` zero bits */
function digRun(base, start, count, target) {
  let bestBits = -1, bestNonce = -1;
  for (let i = 0; i < count; i++) {
    const nonce = start + i;
    const bits = leadingZeroBits(hashText(digText(base, nonce)));
    if (bits > bestBits) { bestBits = bits; bestNonce = nonce; }
    if (bits >= target) return { found: nonce, tried: i + 1, bestBits, bestNonce };
  }
  return { found: -1, tried: count, bestBits, bestNonce };
}
const DIG_LEVELS = [8, 12, 16, 20];

/* ---- Crash Bet: the birthday problem ---- */
const BET_LEVELS = { 1: [64, 100, 144], 2: [400, 900, 1600], 3: [10000, 40000, 65536] };
const BET_RACES = 200, BET_TOLERANCE = 20;

    msg += gap + tr('digVerify', { t: dig.done.text });
    note.hidden = false; note.textContent = msg;
  } else if (dig.handHit && !dig.running) { note.hidden = false; note.textContent = tr('digHandHit', { n: dig.handHit.n, b: dig.handHit.bits }); }
  else note.hidden = true;
  $('digAuto').textContent = tr(dig.running ? 'autoStop' : 'autoStart');
  $('digOnce').disabled = dig.running; $('digBase').disabled = dig.running;
  $('digRec').textContent = S.best.zero > 0 ? tr('digRec', { b: S.best.zero, t: S.best.zeroText }) : tr('digNoRec');
}

/* ================= H2 Crash Bet ================= */
const bet = { level: 1, n: 64, phase: 'idle', seq: null, shown: 0, runs: [], i: 0, bet: null, avg: null, off: null, tag: 1, err: false };
function betNew(level, n) {
  bet.level = level;
  if (n) bet.n = n; else { const opts = BET_LEVELS[level].filter(v => v !== bet.n); bet.n = opts[Math.floor(Math.random() * opts.length)]; }
  bet.phase = 'idle'; bet.seq = null; bet.shown = 0; bet.runs = []; bet.i = 0; bet.bet = null; bet.avg = null; bet.off = null; bet.err = false;
  bet.tag = Math.floor(Math.random() * 1e9);
  $('betInput').value = '';
  renderBet();
}
function betGo() {
  if (bet.phase !== 'idle') return;
  const v = Math.floor(Number($('betInput').value));
  if (!(v >= 1) || !Number.isFinite(v)) { bet.err = true; renderBet(); return; }
  bet.err = false; bet.bet = v; bet.runs = []; bet.i = 0;
  const first = race(bet.n, 'race' + bet.tag + '-0', true);
  bet.runs.push(first.throws); bet.i = 1; bet.seq = first.seq; bet.shown = 0;
  bet.phase = bet.n <= 1600 && !still() ? 'show' : 'run';
  if (bet.phase === 'run') bet.shown = bet.seq.length;
  renderBet();
}
function betFrame() {
  if (bet.phase === 'show') {
    bet.shown = Math.min(bet.seq.length, bet.shown + Math.max(1, Math.ceil(bet.seq.length / 70)));
    drawBetGrid();
    $('betGridCap').textContent = tr('betGridRun', { i: bet.shown });
    if (bet.shown >= bet.seq.length) { sfxCrash(); bet.phase = 'run'; renderBet(); }
  } else if (bet.phase === 'run') {
    const t = performance.now(); let guard = 0;
    while (bet.i < BET_RACES && guard++ < 40) { bet.runs.push(race(bet.n, 'race' + bet.tag + '-' + bet.i, false).throws); bet.i++; if (performance.now() - t > 12) break; }
    if (bet.i >= BET_RACES) {
      bet.avg = bet.runs.reduce((a, b) => a + b, 0) / bet.runs.length;
      bet.off = pctOff(bet.bet, bet.avg);
      bet.phase = 'done';
      const old = S.best.bet[bet.level];
      if (old === undefined || bet.off < old) { S.best.bet[bet.level] = Math.round(bet.off * 10) / 10; save(); renderRecords(); }
      if (bet.off <= BET_TOLERANCE) { sfxRight(); star('bet', bet.level - 1); } else sfxWrong();
    }
    renderBet();
  }
}
function buildBet() {
  const seg = $('betSeg');
  for (let l = 1; l <= 3; l++) {
    const b = document.createElement('button'); b.type = 'button'; b.dataset.level = l;
    b.addEventListener('click', () => { if (bet.phase === 'idle' || bet.phase === 'done') betNew(l); });
    seg.appendChild(b);
  }
  $('betGo').addEventListener('click', betGo);
  $('betInput').addEventListener('keydown', e => { if (e.key === 'Enter') betGo(); });
  $('betNew').addEventListener('click', () => { if (bet.phase === 'idle' || bet.phase === 'done') betNew(bet.level); });
}
function drawBetGrid() {
  const cv = $('betGrid'); const { c, w } = prep(cv);
  const side = Math.round(Math.sqrt(bet.n)), cell = w / side, gap = cell > 6 ? 1 : 0.5;
  const off = tok('--off'), ink = tok('--ink'), acc = tok('--acc');
  c.fillStyle = off;
  for (let i = 0; i < bet.n; i++) c.fillRect((i % side) * cell + gap / 2, Math.floor(i / side) * cell + gap / 2, cell - gap, cell - gap);
  if (!bet.seq) return;
  c.fillStyle = ink;
  for (let k = 0; k < bet.shown; k++) { const s = bet.seq[k]; c.fillRect((s % side) * cell + gap / 2, Math.floor(s / side) * cell + gap / 2, cell - gap, cell - gap); }
  if (bet.shown >= bet.seq.length) {
    const s = bet.seq[bet.seq.length - 1], x = (s % side) * cell, y = Math.floor(s / side) * cell;
    c.fillStyle = acc; c.fillRect(x + gap / 2, y + gap / 2, cell - gap, cell - gap);
    c.strokeStyle = acc; c.lineWidth = 2; c.beginPath(); c.arc(x + cell / 2, y + cell / 2, Math.max(cell, 9), 0, 2 * Math.PI); c.stroke();
  }
}
function drawBetHist() {
  const { c, w, h } = prep($('betHist'));
  const L = 6, R = 6, T = 10, B = 18, pw = w - L - R, ph = h - T - B;
  const hg = histogram(bet.runs, 20), top = Math.max.apply(null, hg.counts);
  const muted = tok('--muted'), line = tok('--line'), acc = tok('--acc'), teal = tok('--wave');
  const xmax = Math.max(hg.max, bet.avg * 1.2);
  const X = v => L + Math.min(1, v / xmax) * pw;
  c.strokeStyle = line; c.lineWidth = 1; c.beginPath(); c.moveTo(L, T + ph + .5); c.lineTo(w - R, T + ph + .5); c.stroke();
  c.fillStyle = muted; c.globalAlpha = .6;
  hg.counts.forEach((n, i) => { const bh = top ? n / top * ph : 0; const x0 = X(i * hg.width), x1 = X((i + 1) * hg.width); c.fillRect(x0 + 1, T + ph - bh, Math.max(1, x1 - x0 - 2), bh); });
  c.globalAlpha = 1;
  const vline = (v, color, dash) => { const x = Math.round(X(v)) + .5; c.strokeStyle = color; c.lineWidth = 2; c.setLineDash(dash || []); c.beginPath(); c.moveTo(x, T - 4); c.lineTo(x, T + ph); c.stroke(); c.setLineDash([]); };
  vline(bet.avg, acc);
  const over = bet.bet > xmax;
  vline(over ? xmax : bet.bet, teal, [5, 4]);
  c.fillStyle = muted; c.textBaseline = 'top'; c.textAlign = 'left'; c.fillText('0', L, T + ph + 5);
  c.textAlign = 'right'; c.fillText(num(xmax) + (over ? ' →' : ''), w - R, T + ph + 5);
  c.textAlign = 'center'; c.fillText(num(xmax / 2), L + pw / 2, T + ph + 5);
}
function renderBet() {
  document.querySelectorAll('#betSeg button').forEach(b => {
    const l = Number(b.dataset.level);
    b.textContent = tr('table', { n: l }); b.classList.toggle('on', l === bet.level); b.classList.toggle('won', S.stars.bet[l - 1]);
    b.disabled = bet.phase === 'show' || bet.phase === 'run';
  });
  $('betAsk').textContent = tr('betAsk', { n: num(bet.n) });
  const busy = bet.phase === 'show' || bet.phase === 'run';
  $('betGo').disabled = bet.phase !== 'idle'; $('betInput').disabled = bet.phase !== 'idle'; $('betNew').disabled = busy;
  const big = bet.n > 1600;
  $('betGridWrap').hidden = big;
  if (!big) drawBetGrid();
  const cap = $('betGridCap');
  if (big) cap.textContent = tr('betGridBig');
  else if (bet.phase === 'idle') cap.textContent = tr('betGridIdle');
  else if (bet.phase === 'show') cap.textContent = tr('betGridRun', { i: bet.shown });
  else cap.textContent = tr('betGridDone', { i: bet.seq.length });
  const note = $('betNote'); note.classList.remove('bad');
  const hist = $('betHist'), leg = $('betLegend');
  hist.hidden = leg.hidden = bet.phase !== 'done';
  if (bet.err) { note.hidden = false; note.classList.add('bad'); note.textContent = tr('betBad'); }
  else if (bet.phase === 'run') { note.hidden = false; note.textContent = tr('betRunning', { i: bet.i }); }
  else if (bet.phase === 'done') {
    const win = bet.off <= BET_TOLERANCE;
    note.hidden = false; note.classList.toggle('bad', !win);
    note.textContent = tr(win ? 'betWin' : 'betLose') + tr('betResult', { a: bet.avg.toFixed(1), b: num(bet.bet), p: bet.off.toFixed(0) }) + ' ' +
      tr('betRule', { n: num(bet.n), r: (1.25 * Math.sqrt(bet.n)).toFixed(1).replace(/\.0$/, '') });
    drawBetHist();
  } else note.hidden = true;
  const rec = S.best.bet[bet.level];
  $('betRec').textContent = rec === undefined ? tr('betNoRec') : tr('betRec', { p: rec.toFixed(1) });
}

/* ================= shell ================= */
function renderSound() {
  const b = $('soundBtn'); b.classList.toggle('off', !S.sound);
  b.setAttribute('aria-label', tr(S.sound ? 'soundOn' : 'soundOff')); b.title = tr(S.sound ? 'soundOn' : 'soundOff'); b.setAttribute('aria-pressed', String(S.sound));
}
function renderAll() { renderStars(); renderDig(); renderBet(); }
function applyText() {
  document.documentElement.lang = S.lang === 'zh' ? 'zh-CN' : 'en';
  document.title = S.lang === 'zh' ? '哈希游戏厅' : 'Hash Arcade';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = tr(el.dataset.i18nHtml); });
  $('langBtn').textContent = tr('langBtn');
  renderSound(); renderAll();
}
function tick() { digFrame(); betFrame(); requestAnimationFrame(tick); }
function start(data) {
  restore(data);
  buildDig(); buildBet();
  document.querySelectorAll('.jump').forEach(b => b.addEventListener('click', () => $(b.dataset.jump).scrollIntoView({ behavior: still() ? 'auto' : 'smooth', block: 'start' })));
  $('langBtn').addEventListener('click', () => { S.lang = S.lang === 'en' ? 'zh' : 'en'; save(); applyText(); });
  $('soundBtn').addEventListener('click', () => { S.sound = !S.sound; save(); renderSound(); if (S.sound) sfxRight(); });
  document.addEventListener('click', () => { if (S.sound) audio(); }, true);
  betNew(1, 64);
  applyText();
  let timer = 0;
  window.addEventListener('resize', () => { clearTimeout(timer); timer = setTimeout(renderAll, 120); });
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderAll); } catch (e) {}
  try { new MutationObserver(renderAll).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
  requestAnimationFrame(tick);
}
try { window.claude?.hot?.snapshot?.(() => JSON.parse(JSON.stringify(S))); } catch (e) {}
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});

</script>
