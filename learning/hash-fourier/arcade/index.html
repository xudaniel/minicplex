<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fourier Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
/* Layout: one column of four game cabinets on oscilloscope graph paper.
   Same world as the Hash/Fourier course: ink on cool paper, teal for waves,
   vermilion only for the thing you are aiming at or just hit. */
:root {
  --paper: #EDF0F4;
  --grid: #DCE2EA;
  --card: #FBFCFD;
  --ink: #141B2B;
  --muted: #586377;
  --line: #C5CDD8;
  --off: #E1E6ED;
  --hot: #D93A22;
  --wave: #0B7A85;
  --ok: #1F7F52;
  --f-display: "ZCOOL QingKe HuangYou", "PingFang SC", "Microsoft YaHei", sans-serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0C111D; --grid: #151C2C; --card: #141B2B; --ink: #E7ECF5;
    --muted: #95A1B8; --line: #2B3650; --off: #1F2940;
    --hot: #FF6A48; --wave: #42C4CE; --ok: #4CC38A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0C111D; --grid: #151C2C; --card: #141B2B; --ink: #E7ECF5;
  --muted: #95A1B8; --line: #2B3650; --off: #1F2940;
  --hot: #FF6A48; --wave: #42C4CE; --ok: #4CC38A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.6;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 0 18px; }
h1, h2 { font-family: var(--f-display); font-weight: 400; text-wrap: balance; margin: 0; }
p { margin: 0; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.nav { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--paper) 90%, transparent);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.nav .wrap { display: flex; gap: 6px; padding-top: 8px; padding-bottom: 8px; align-items: center; }
.nav button { height: 32px; padding: 0 10px; font-size: 13px; background: transparent; border: 1.5px solid var(--line); border-radius: 3px; cursor: pointer; white-space: nowrap; }
.nav button.jump { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.nav button.jump.full { background: var(--wave); border-color: var(--wave); color: #fff; }
.nav .stars { font-family: var(--f-mono); font-size: 13px; font-weight: 600; padding: 0 4px; white-space: nowrap; }

.top { padding: 36px 0 4px; display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; color: var(--muted); }
h1 { font-size: clamp(54px, 15vw, 104px); line-height: .98; letter-spacing: .01em; }
h1 span { color: var(--wave); }
.lead { max-width: 36em; font-size: 17px; }
#heroWave { height: 64px; }

.game { margin-top: 52px; padding-top: 18px; border-top: 3px solid var(--ink); scroll-margin-top: 60px; display: flex; flex-direction: column; gap: 14px; }
.game-head { display: grid; grid-template-columns: auto 1fr; column-gap: 12px; align-items: baseline; }
.tag { font-family: var(--f-mono); font-weight: 600; font-size: 14px; color: var(--wave); border: 1.5px solid var(--wave); border-radius: 3px; padding: 0 7px; }
.game-head h2 { font-size: 34px; line-height: 1.15; }
.how { grid-column: 1 / -1; margin-top: 6px; max-width: 40em; }
.goals { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); }
.goals li { display: grid; grid-template-columns: 20px 1fr; align-items: baseline; }
.goals li::before { content: "☆"; font-size: 15px; }
.goals li.done { color: var(--ink); font-weight: 700; }
.goals li.done::before { content: "★"; color: var(--wave); }

.bench { background: var(--card); border: 1.5px solid var(--ink); border-radius: 4px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.cap { font-size: 13px; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { min-height: 40px; padding: 7px 14px; cursor: pointer; background: var(--wave); color: #fff; border: 0; border-radius: 4px; font-weight: 700; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); font-weight: 500; }
.btn[hidden] { display: none; }
.seg { display: flex; border: 1.5px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { flex: 1; min-height: 38px; padding: 6px 4px; background: transparent; border: 0; border-left: 1.5px solid var(--line); cursor: pointer; font-size: 13px; white-space: nowrap; }
.seg button:first-child { border-left: 0; }
.seg button.on { background: var(--ink); color: var(--paper); }
.seg button.won::after { content: " ★"; color: var(--wave); }
.seg button.on.won::after { color: var(--paper); }
canvas { display: block; width: 100%; }
input[type="range"] { width: 100%; accent-color: var(--wave); margin: 0; height: 26px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 14px; height: 0; margin-right: 5px; border-top: 2.5px solid var(--sw); vertical-align: 3px; }
.legend .dash::before { border-top-style: dashed; }
.big { font-family: var(--f-mono); font-weight: 600; font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.big small { font-family: var(--f-body); font-weight: 400; font-size: 14px; color: var(--muted); }
.meter { position: relative; height: 12px; background: var(--off); border-radius: 2px; overflow: hidden; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--wave); transition: width .15s; }
.note { font-size: 15px; border-left: 4px solid var(--wave); padding-left: 12px; }
.note[hidden] { display: none; }
.note.bad { border-left-color: var(--hot); }

.oscs { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 18px; }
.osc { display: flex; flex-direction: column; gap: 2px; }
.osc .name { font-size: 13px; font-weight: 700; }
.osc label { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }

.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opts button { padding: 8px 8px 4px; background: var(--paper); border: 1.5px solid var(--line); border-radius: 4px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; text-align: left; }
.opts button:not(:disabled):hover { border-color: var(--ink); }
.opts button:disabled { cursor: default; }
.opts button canvas { height: 84px; }
.opts button .lab { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.opts button.right { border-color: var(--ok); box-shadow: inset 0 0 0 2px var(--ok); }
.opts button.wrong { border-color: var(--hot); opacity: .6; }

.cells { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.cells button { aspect-ratio: 1; min-width: 0; padding: 0; background: var(--paper); border: 1.5px solid var(--line); border-radius: 4px; cursor: pointer;
  font-family: var(--f-mono); font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
.cells button:not(:disabled):hover { border-color: var(--ink); }
.cells button:disabled { cursor: default; }
.cells button small { font-size: 10px; color: var(--muted); }
.cells button.miss { background: var(--off); color: var(--muted); border-style: dashed; }
.cells button.hit { background: var(--wave); border-color: var(--wave); color: #fff; font-weight: 600; }
.cells button.hit small { color: #fff; }
.cells button.reveal { border: 2px solid var(--hot); color: var(--hot); }

.pad { position: relative; width: 100%; max-width: 440px; align-self: center; }
.pad canvas { aspect-ratio: 1; height: auto; background: var(--paper); border: 1.5px dashed var(--line); border-radius: 4px; touch-action: none; cursor: crosshair; }

.end { margin: 56px 0 0; padding: 20px 0 48px; border-top: 3px solid var(--ink); display: flex; flex-direction: column; gap: 8px; }
.end .fine { font-size: 13px; color: var(--muted); max-width: 44em; }
.stats { display: flex; flex-wrap: wrap; gap: 2px 16px; font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 600; }
.nav #soundBtn.off { color: var(--muted); text-decoration: line-through; }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 10; max-width: calc(100% - 36px);
  background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 4px; font-weight: 700; font-size: 15px;
  opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.show { opacity: 1; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.7); } 100% { transform: scale(1); } }
.goals li.just::before { display: inline-block; animation: pop .6s ease; }
.end h2 { font-size: 34px; }
.records { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; margin: 4px 0 6px; font-size: 14px; }
.records dt { font-weight: 700; }
.records dd { margin: 0; color: var(--muted); font-variant-numeric: tabular-nums; }
.end.cleared h2 { color: var(--wave); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<nav class="nav" aria-label="Games"><div class="wrap">
  <button class="jump" type="button" data-jump="tune" data-i18n="nav1"></button>
  <button class="jump" type="button" data-jump="snap" data-i18n="nav2"></button>
  <button class="jump" type="button" data-jump="hunt" data-i18n="nav3"></button>
  <button class="jump" type="button" data-jump="circ" data-i18n="nav4"></button>
  <span class="stars" id="starCount"></span>
  <button type="button" id="soundBtn">♪</button>
  <button type="button" id="langBtn"></button>
</div></nav>

<main class="wrap">
<header class="top">
  <div class="eyebrow" data-i18n="eyebrow"></div>
  <h1 data-i18n-html="title"></h1>
  <canvas id="heroWave" aria-hidden="true"></canvas>
  <p class="lead" data-i18n="lead"></p>
</header>

<!-- ================= 1 ================= -->
<section class="game" id="tune">
  <div class="game-head"><span class="tag">G1</span><h2 data-i18n="g1title"></h2><p class="how" data-i18n="g1how"></p></div>
  <ul class="goals"><li data-goal="tune0" data-i18n="g1goal0"></li><li data-goal="tune1" data-i18n="g1goal1"></li><li data-goal="tune2" data-i18n="g1goal2"></li></ul>
  <div class="bench">
    <div class="seg" id="tuneSeg"></div>
    <canvas id="tuneWave" style="height:170px" role="img" aria-label="Target wave and your wave"></canvas>
    <div class="legend"><span class="dash" style="--sw:var(--hot)" data-i18n="legTarget"></span><span style="--sw:var(--wave)" data-i18n="legMine"></span></div>
    <div class="big"><span id="tunePct"></span><small> % <span data-i18n="match"></span></small></div>
    <div class="meter"><i id="tuneBar"></i></div>
    <div class="stats"><span id="tuneTime"></span><span id="tuneBest"></span></div>
    <p class="note" id="tuneNote" hidden></p>
    <div class="oscs" id="oscs"></div>
    <div class="row">
      <button class="btn ghost" type="button" id="tunePlayT" data-i18n="playTarget"></button>
      <button class="btn ghost" type="button" id="tunePlayM" data-i18n="playMine"></button>
      <button class="btn ghost" type="button" id="tuneHint"></button>
      <button class="btn" type="button" id="tuneNew" data-i18n="newRandom" hidden></button>
    </div>
    <canvas id="tuneSpec" style="height:110px" role="img" aria-label="Spectrum of the target" hidden></canvas>
  </div>
</section>

<!-- ================= 2 ================= -->
<section class="game" id="snap">
  <div class="game-head"><span class="tag">G2</span><h2 data-i18n="g2title"></h2><p class="how" data-i18n="g2how"></p></div>
  <ul class="goals"><li data-goal="snap0" data-i18n="g2goal0"></li><li data-goal="snap1" data-i18n="g2goal1"></li><li data-goal="snap2" data-i18n="g2goal2"></li></ul>
  <div class="bench">
    <div class="row" style="justify-content:space-between;align-items:baseline"><span class="num" id="snapRound"></span><span class="big" id="snapPts"></span></div>
    <div class="meter" aria-hidden="true"><i id="snapBonus"></i></div>
    <div class="stats"><span id="snapClock"></span><span id="snapScore"></span><span id="snapStreak"></span><span id="snapBest"></span></div>
    <canvas id="snapWave" style="height:140px" role="img" aria-label="Wave to identify"></canvas>
    <span class="cap" data-i18n="snapAsk"></span>
    <div class="opts" id="snapOpts"></div>
    <p class="note" id="snapNote" hidden></p>
    <div class="row"><button class="btn" type="button" id="snapNext" hidden></button></div>
  </div>
</section>

<!-- ================= 3 ================= -->
<section class="game" id="hunt">
  <div class="game-head"><span class="tag">G3</span><h2 data-i18n="g3title"></h2><p class="how" data-i18n="g3how"></p></div>
  <ul class="goals"><li data-goal="hunt0" data-i18n="g3goal0"></li><li data-goal="hunt1" data-i18n="g3goal1"></li><li data-goal="hunt2" data-i18n="g3goal2"></li></ul>
  <div class="bench">
    <div class="seg" id="huntSeg"></div>
    <canvas id="huntWave" style="height:150px" role="img" aria-label="Signal with hidden waves"></canvas>
    <div class="row" style="justify-content:space-between"><span class="num" id="huntLeft"></span><span class="num" id="huntFound"></span></div>
    <div class="stats"><span id="huntBest"></span></div>
    <div class="cells" id="huntCells"></div>
    <p class="note" id="huntNote"></p>
    <canvas id="huntProd" style="height:90px" role="img" aria-label="Signal times probe" hidden></canvas>
    <span class="cap" id="huntProdCap" data-i18n="prodCap" hidden></span>
    <div class="row"><button class="btn ghost" type="button" id="huntNew" data-i18n="newBoard"></button></div>
  </div>
</section>

<!-- ================= 4 ================= -->
<section class="game" id="circ">
  <div class="game-head"><span class="tag">G4</span><h2 data-i18n="g4title"></h2><p class="how" data-i18n="g4how"></p></div>
  <ul class="goals"><li data-goal="circ0" data-i18n="g4goal0"></li><li data-goal="circ1" data-i18n="g4goal1"></li><li data-goal="circ2" data-i18n="g4goal2"></li></ul>
  <div class="bench">
    <div class="pad"><canvas id="pad" role="img" aria-label="Drawing pad"></canvas></div>
    <div class="legend"><span style="--sw:var(--line)" data-i18n="legDrawn"></span><span style="--sw:var(--wave)" data-i18n="legCopy"></span><span style="--sw:var(--muted)" data-i18n="legArms"></span></div>
    <label class="cap" for="circM"><span id="circMLabel"></span></label>
    <input type="range" id="circM" min="1" max="60" step="1">
    <div class="big"><span id="circFid"></span><small> % <span data-i18n="fidelity"></span></small></div>
    <p class="cap" id="circNeed"></p>
    <div class="stats"><span id="circRec"></span></div>
    <p class="note" id="circNote" hidden></p>
    <div class="row">
      <button class="btn ghost" type="button" id="circHeart" data-i18n="heartDemo"></button>
      <button class="btn ghost" type="button" id="circClear" data-i18n="clearPad"></button>
    </div>
  </div>
</section>

<section class="end" id="end">
  <h2 id="endTitle"></h2>
  <p class="num" id="endStars"></p>
  <dl class="records" id="records"></dl>
  <p class="fine" data-i18n="fine"></p>
</section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/*CORE-START*/
function mulberry(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function pick(rand, arr) { return arr[Math.floor(rand() * arr.length)]; }
function pickFreqs(rand, n, max) {
  const set = new Set();
  while (set.size < n) set.add(1 + Math.floor(rand() * max));
  return Array.from(set).sort((a, b) => a - b);
}
function mixAt(parts, t) {
  let v = 0;
  for (const p of parts) v += p.a * Math.sin(2 * Math.PI * p.f * t + (p.ph || 0));
  return v;
}
function sampleParts(parts, N) {
  const x = new Float64Array(N);
  for (let n = 0; n < N; n++) x[n] = mixAt(parts, n / N);
  return x;
}
/* amplitude of each frequency 0..kmax, straight DFT as in fourier.c */
function spectrum(x, kmax) {
  const N = x.length, out = [];
  for (let k = 0; k <= kmax; k++) {
    let re = 0, im = 0;
    for (let n = 0; n < N; n++) {
      const a = 2 * Math.PI * ((k * n) % N) / N;
      re += x[n] * Math.cos(a); im -= x[n] * Math.sin(a);
    }
    out.push(Math.hypot(re, im) * (k === 0 ? 1 : 2) / N);
  }
  return out;
}
function probe(parts, k, N) {
  N = N || 64;
  const x = sampleParts(parts, N);
  let ss = 0, sc = 0;
  for (let n = 0; n < N; n++) {
    const a = 2 * Math.PI * ((k * n) % N) / N;
    ss += x[n] * Math.sin(a); sc += x[n] * Math.cos(a);
  }
  ss = ss * 2 / N; sc = sc * 2 / N;
  return { sin: ss, cos: sc, amp: Math.hypot(ss, sc) };
}
function matchPct(target, mine) {
  const N = 256, a = sampleParts(target, N), b = sampleParts(mine, N);
  let e = 0, r = 0;
  for (let i = 0; i < N; i++) { e += (a[i] - b[i]) * (a[i] - b[i]); r += a[i] * a[i]; }
  if (r === 0) return e === 0 ? 100 : 0;
  return Math.max(0, 1 - Math.sqrt(e / r)) * 100;
}

/* ---- Tune It ---- */
const TUNE_LEVELS = {
  1: [{ f: 4, a: 0.8 }],
  2: [{ f: 2, a: 1 }, { f: 9, a: 0.4 }],
  3: [{ f: 3, a: 0.7 }, { f: 5, a: 0.5 }, { f: 11, a: 0.3 }],
  4: [{ f: 1, a: 1 }, { f: 3, a: 0.35 }, { f: 5, a: 0.2 }]
};
function tuneRandom(rand) {
  return pickFreqs(rand, 3, 12).map(f => ({ f, a: Math.round((0.2 + rand() * 0.8) * 20) / 20 }));
}

/* ---- Spectrum Snap ---- */
const SNAP_AMPS = [0.3, 0.5, 0.8, 1];
const SNAP_PLAN = [1, 1, 1, 2, 2, 2, 3, 3];
function partsKey(ps) { return ps.slice().sort((a, b) => a.f - b.f).map(p => p.f + ':' + p.a).join(','); }
function snapRound(rand, nWaves) {
  const fs = pickFreqs(rand, nWaves, 12);
  const parts = fs.map(f => ({ f, a: pick(rand, SNAP_AMPS) }));
  if (nWaves >= 2 && parts.every(p => p.a === parts[0].a)) parts[0].a = parts[0].a === 1 ? 0.5 : 1;
  const opts = [parts], seen = new Set([partsKey(parts)]);
  const add = ps => {
    if (opts.length >= 4 || !ps) return;
    if (ps.some(p => p.f < 1 || p.f > 12)) return;
    if (new Set(ps.map(p => p.f)).size !== ps.length) return;
    const k = partsKey(ps);
    if (seen.has(k)) return;
    seen.add(k); opts.push(ps);
  };
  const clone = () => parts.map(p => ({ f: p.f, a: p.a }));
  const big = parts.reduce((m, p, i) => (p.a > parts[m].a ? i : m), 0);
  const cands = [];
  if (nWaves >= 2) {                                   // swapped heights
    const c = clone(); const t = c[0].a; c[0].a = c[c.length - 1].a; c[c.length - 1].a = t; cands.push(c);
    const sum = parts[0].f + parts[1].f;               // "frequencies add up" mistake
    cands.push([{ f: sum, a: Math.max(parts[0].a, parts[1].a) }]);
  }
  for (const d of [1, -1, 2, -2]) { const c = clone(); c[big].f += d; cands.push(c); }
  for (const d of [1, -1]) cands.push(clone().map(p => ({ f: p.f + d, a: p.a })));
  { const c = clone(); c[big].f *= 2; cands.push(c); }
  // mix the order a little so the wrong answers are not always the same kind
  for (let i = cands.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); const t = cands[i]; cands[i] = cands[j]; cands[j] = t; }
  cands.forEach(add);
  let guard = 0;
  while (opts.length < 4 && guard++ < 200) add(pickFreqs(rand, nWaves, 12).map(f => ({ f, a: pick(rand, SNAP_AMPS) })));
  const order = [0, 1, 2, 3];
  for (let i = 3; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); const t = order[i]; order[i] = order[j]; order[j] = t; }

/* ---- Circle Artist ---- */
function resample(pts, N) {
  const P = pts.concat([pts[0]]);
  const cum = [0];
  for (let i = 1; i < P.length; i++) cum.push(cum[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]));
  const total = cum[cum.length - 1];
  const out = [];
  let j = 1;
  for (let i = 0; i < N; i++) {
    const d = total * i / N;
    while (j < cum.length - 1 && cum[j] < d) j++;
    const seg = cum[j] - cum[j - 1];
    const u = seg > 0 ? (d - cum[j - 1]) / seg : 0;
    out.push([P[j - 1][0] + (P[j][0] - P[j - 1][0]) * u, P[j - 1][1] + (P[j][1] - P[j - 1][1]) * u]);

}
/* complex DFT of a closed path; every coefficient is one spinning circle */
function epicycles(pts) {

    for (let n = 0; n < N; n++) {
      const idx = (((k * n) % N) + N) % N;
      const a = 2 * Math.PI * idx / N;
      const c = Math.cos(a), s = Math.sin(a);
      re += pts[n][0] * c + pts[n][1] * s;
      im += pts[n][1] * c - pts[n][0] * s;
    }
    re /= N; im /= N;
    all.push({ k, re, im, mag: Math.hypot(re, im) });
  }
  const c0 = all.find(c => c.k === 0);
  const rest = all.filter(c => c.k !== 0).sort((a, b) => b.mag - a.mag);
  let total = 0; for (const c of rest) total += c.mag * c.mag;
  const fid = [0]; let cum = 0;
  for (const c of rest) { cum += c.mag * c.mag; fid.push(total > 0 ? (1 - Math.sqrt(Math.max(0, total - cum) / total)) * 100 : 100); }
  return { c0, rest, fid };
}

}

  let x = ep.c0.re, y = ep.c0.im;

    if (arms) arms.push([x, y, c.mag]);
    x += c.re * cs - c.im * sn; y += c.re * sn + c.im * cs;

}

  const raw = [];

    const t = 2 * Math.PI * i / 240, s = Math.sin(t);
    raw.push([16 * s * s * s, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))]);

function circleGoals(ep) {
  const n90 = circlesNeeded(ep, CIRCLE_GOALS.onePct), n95 = circlesNeeded(ep, CIRCLE_GOALS.manyPct);

}

function restore(data) {
  let saved = {};

  const src = Object.assign({}, saved, data || {});
  if (src.lang === 'en' || src.lang === 'zh') S.lang = src.lang;
  if (typeof src.sound === 'boolean') S.sound = src.sound;
  const b = src.best;
  if (b && typeof b === 'object') {
    const num = v => (Number.isFinite(v) && v >= 0 ? v : 0);
    if (b.tune && typeof b.tune === 'object') for (let l = 1; l <= 5; l++) if (num(b.tune[l]) > 0) S.best.tune[l] = b.tune[l];
    if (b.hunt && typeof b.hunt === 'object') for (let l = 1; l <= 3; l++) if (Number.isFinite(b.hunt[l]) && b.hunt[l] >= 0) S.best.hunt[l] = b.hunt[l];
    S.best.snap = num(b.snap); S.best.round = num(b.round); S.best.many = num(b.many);
  }
  if (src.stars && typeof src.stars === 'object') {
    for (const g of Object.keys(S.stars)) {

}

  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    circ.drawing = true; circ.raw = [padPoint(e)]; circ.msg = null; drawPad();
  });
  cv.addEventListener('pointermove', e => {
    if (!circ.drawing) return;
    const p = padPoint(e), q = circ.raw[circ.raw.length - 1];
    if (Math.hypot(p[0] - q[0], p[1] - q[1]) > 0.006) { circ.raw.push(p); drawPad(); }
  });
  const finish = () => {
    if (!circ.drawing) return;
    circ.drawing = false;
    const raw = circ.raw; circ.raw = [];
    let len = 0; for (let i = 1; i < raw.length; i++) len += Math.hypot(raw[i][0] - raw[i - 1][0], raw[i][1] - raw[i - 1][1]);
    if (raw.length < 12 || len < 0.5) { circ.msg = 'circSmall'; renderCirc(); return; }
    circSet(raw, false);
  };
  cv.addEventListener('pointerup', finish);
  cv.addEventListener('pointercancel', finish);
  $('circM').addEventListener('input', e => { circ.M = Number(e.target.value); if (circ.ep) circPath(); renderCirc(); });
  $('circHeart').addEventListener('click', () => circSet(heartShape(), true));
  $('circClear').addEventListener('click', () => { circ.pts = null; circ.ep = null; circ.path = []; circ.msg = null; circ.got = null; renderCirc(); });
  try { new IntersectionObserver(es => { circ.visible = es[0].isIntersecting; }).observe(cv); } catch (e) {}
}
function renderCirc() {
  $('circM').value = circ.M;
  $('circMLabel').textContent = tr('circM', { m: circ.M });
  const n = k => (k === 1 ? tr('circle1') : tr('circleN', { n: k }));
  if (circ.ep) {
    const f = circ.ep.fid[Math.min(circ.M, circ.ep.fid.length - 1)];
    $('circFid').textContent = f.toFixed(1);
    $('circNeed').textContent = tr('circNeed', { a: n(circlesNeeded(circ.ep, 90)), b: n(circlesNeeded(circ.ep, 95)) });
  } else { $('circFid').textContent = '–'; $('circNeed').textContent = ''; }
  $('circRec').textContent = S.best.round > 0 ? tr('circRec', { a: S.best.round.toFixed(1), b: n(S.best.many) }) : tr('circNoRec');
  const note = $('circNote');
  const key = circ.msg || (circ.ep && circ.demo ? 'circDemo' : (circ.got !== null ? 'circGot' + circ.got : null));
  note.hidden = !key; note.classList.toggle('bad', key === 'circSmall');
  if (key) note.textContent = tr(key);
  drawPad();
}
function drawPad() {
  const cv = $('pad');
  const { c, w, h } = prep(cv);
  const X = p => p[0] * w, Y = p => p[1] * h;
  const line = tok('--line'), wave = tok('--wave'), muted = tok('--muted'), ink = tok('--ink');
  if (circ.drawing) {
    c.strokeStyle = ink; c.lineWidth = 2.5; c.lineJoin = 'round'; c.lineCap = 'round';
    c.beginPath(); circ.raw.forEach((p, i) => (i ? c.lineTo(X(p), Y(p)) : c.moveTo(X(p), Y(p)))); c.stroke();
    return;
  }
  if (!circ.ep) {
    c.fillStyle = muted; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = '15px ' + (tok('--f-body') || 'sans-serif');
    c.fillText(tr('drawHere'), w / 2, h / 2);
    return;
  }
  // the original drawing
  c.strokeStyle = line; c.lineWidth = 5; c.lineJoin = 'round';
  c.beginPath(); circ.pts.forEach((p, i) => (i ? c.lineTo(X(p), Y(p)) : c.moveTo(X(p), Y(p)))); c.closePath(); c.stroke();
  // the circles' copy: whole path faint, the part already traced bold
  const upto = still() ? 256 : Math.floor(circ.tau * 256);
  c.strokeStyle = wave; c.lineWidth = 1; c.globalAlpha = .35;
  c.beginPath(); circ.path.forEach((p, i) => (i ? c.lineTo(X(p), Y(p)) : c.moveTo(X(p), Y(p)))); c.stroke();
  c.globalAlpha = 1; c.lineWidth = 2.5;
  c.beginPath(); for (let i = 0; i <= upto; i++) { const p = circ.path[i]; i ? c.lineTo(X(p), Y(p)) : c.moveTo(X(p), Y(p)); } c.stroke();
  // circles and arms
  const arms = []; const tip = reconAt(circ.ep, circ.M, still() ? 0 : circ.tau, arms);
  c.strokeStyle = muted; c.lineWidth = 1;
  arms.forEach((a, i) => {
    c.globalAlpha = .35; c.beginPath(); c.arc(a[0] * w, a[1] * h, a[2] * w, 0, 2 * Math.PI); c.stroke();
    const nx = i + 1 < arms.length ? arms[i + 1] : tip;
    c.globalAlpha = .9; c.beginPath(); c.moveTo(a[0] * w, a[1] * h); c.lineTo(nx[0] * w, nx[1] * h); c.stroke();
  });
  c.globalAlpha = 1; c.fillStyle = tok('--hot');
  c.beginPath(); c.arc(tip[0] * w, tip[1] * h, 4, 0, 2 * Math.PI); c.fill();
}
function tick(now) {
  if (circ.ep && !circ.drawing && circ.visible && !still() && !document.hidden) {
    const dt = Math.min(0.1, (now - (circ.last || now)) / 1000);
    circ.tau = (circ.tau + dt / 8) % 1;
    drawPad();
  }
  circ.last = now;
  snapClock(now);
  if (tune.t0 !== null && !tune.timed) renderTuneClock();
  requestAnimationFrame(tick);
}

/* ================= shell ================= */
const HERO = [{ f: 1, a: 1 }, { f: 3, a: 0.35 }, { f: 5, a: 0.2 }, { f: 7, a: 0.14 }];
function drawHero() { drawCurves($('heroWave'), [{ fn: t => mixAt(HERO, t * 3), color: tok('--wave'), width: 2.5 }], 1.25); }
function applyText() {
  document.documentElement.lang = S.lang === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = tr(el.dataset.i18nHtml); });
  $('langBtn').textContent = tr('langBtn');
  renderSound();
  renderAll();
}
function renderSound() {
  const b = $('soundBtn');
  b.classList.toggle('off', !S.sound);
  b.setAttribute('aria-label', tr(S.sound ? 'soundOn' : 'soundOff'));
  b.title = tr(S.sound ? 'soundOn' : 'soundOff');
  b.setAttribute('aria-pressed', String(S.sound));
}
function renderAll() { renderStars(); drawHero(); renderTune(); renderSnap(); renderHunt(); renderCirc(); }

function start(data) {
  restore(data);
  buildTune(); buildSnap(); buildHunt(); buildCirc();
  document.querySelectorAll('.jump').forEach(b => b.addEventListener('click', () => $(b.dataset.jump).scrollIntoView({ behavior: still() ? 'auto' : 'smooth', block: 'start' })));
  $('langBtn').addEventListener('click', () => { S.lang = S.lang === 'en' ? 'zh' : 'en'; save(); applyText(); });
  $('soundBtn').addEventListener('click', () => { S.sound = !S.sound; save(); renderSound(); if (S.sound) sfxRight(); });
  // browsers only allow sound after a click, so wake the audio on the first one
  document.addEventListener('click', () => { if (S.sound) audio(false); }, true);
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(el.dataset.i18n); });
  tune.mine = [{ f: 1, a: 0.5 }, { f: 2, a: 0 }, { f: 3, a: 0 }];
  tuneReset(1);
  snapNewRun(11);
  huntNew(1, 2026);
  circSet(heartShape(), true);
  applyText();
  let timer = 0;
  window.addEventListener('resize', () => { clearTimeout(timer); timer = setTimeout(renderAll, 120); });
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderAll); } catch (e) {}
  try { new MutationObserver(renderAll).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderAll).catch(() => {});
  requestAnimationFrame(tick);
}
try { window.claude?.hot?.snapshot?.(() => JSON.parse(JSON.stringify(S))); } catch (e) {}
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
</script>
