name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    name: 编译 + 测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: AddressSanitizer + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DMINICPLEX_SANITIZE=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure

  fuzz-vs-highs:
    name: 与 HiGHS 对拍（随机混合整数题）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scipy
        run: pip install numpy scipy
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j 4
      - name: Fuzz (每次提交用不同的随机种子)
        run: |
          SEED=${{ github.run_number }}
          echo "seed = $SEED"
          ./build/minicplex_gen --kind mixed --count 500 --seed $SEED --out fuzz
          ./build/minicplex_bench fuzz --gap 1e-9 --nodes 200000 --quiet --csv fuzz/ours.csv
          python3 tools/fuzz_vs_highs.py fuzz fuzz/ours.csv

  benchmark:
    name: 基准测试（与基线比对）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j 4
      - name: Run benchmark
        run: ./build/minicplex_bench bench/models --csv new.csv
      - name: Compare with baseline
        run: |
          echo "== 与 v0.1 旧内核对比 =="
          python3 tools/bench_compare.py bench/baseline_v0.1.csv new.csv
          echo "== 与当前基线对比（防止性能和结果倒退） =="
          python3 tools/bench_compare.py bench/baseline.csv new.csv

  java:
    name: Java 版（JDK ${{ matrix.java }}）：测试 + 与 C++ 逐个对比
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: 构建 + 测试（只用 javac / jar）
        run: java/build.sh
      - name: Java 教程：参考答案全部通过、练习文件和答案同步
        run: |
          python3 java/tutorial/make_exercises.py --check
          java/tutorial/run.sh all --solution
          java/tutorial/run.sh all > /dev/null   # 练习文件（挖空版）也要能编译
      - name: 构建 + 测试（Maven）
        run: mvn -B -q -f java/pom.xml package
      - name: 构建 C++ 版
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j 4
      - name: 例子输出逐字对比
        run: tools/compare_examples_java_cpp.sh build java/build/minicplex.jar
      - name: 基准模型对比（节点数、迭代次数都必须一样）
        run: |
          ./build/minicplex_bench bench/models --quiet --csv cpp.csv
          java -cp java/build/minicplex.jar minicplex.tools.Bench bench/models --quiet --csv java.csv
          python3 tools/compare_java_cpp.py cpp.csv java.csv --strict
      - name: 随机题对比（每次提交换一个种子）
        run: |
          SEED=${{ github.run_number }}
          ./build/minicplex_gen --kind mixed --count 300 --seed $SEED --out fuzz
          ./build/minicplex_bench fuzz --gap 1e-9 --nodes 200000 --quiet --csv cpp_fuzz.csv
          java -cp java/build/minicplex.jar minicplex.tools.Bench fuzz --gap 1e-9 --nodes 200000 --quiet --csv java_fuzz.csv
          python3 tools/compare_java_cpp.py cpp_fuzz.csv java_fuzz.csv --strict

  python:
    name: Python 版（${{ matrix.python }}）：测试 + 与 C++ 逐个对比
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 测试（只用标准库 unittest）
        run: python -m unittest discover -s python/tests -v
      - name: 能用 pip 安装
        run: pip install ./python && cd /tmp && python -c "import minicplex; print(minicplex.__file__)" && minicplex-py --help > /dev/null
      - name: Python 教程：参考答案全部通过、练习文件和答案同步
        run: |
          python python/tutorial/make_exercises.py --check
          python python/tutorial/run.py all --solution
          python python/tutorial/run.py all > /dev/null; test $? -ne 1   # 练习文件（挖空版）只能是“没写完”，不能报错
      - name: 构建 C++ 版
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j 4
      - name: 例子输出逐字对比
        run: tools/compare_examples_py_cpp.sh build
      - name: 基准模型对比（节点数、迭代次数都必须一样）
        run: |
          ./build/minicplex_bench bench/models --quiet --csv cpp.csv
          (cd python && python -m minicplex.bench ../bench/models --quiet --csv ../py.csv)
          python tools/compare_java_cpp.py cpp.csv py.csv --strict --label Python
      - name: 随机题对比（每次提交换一个种子）
        run: |
          SEED=${{ github.run_number }}
          ./build/minicplex_gen --kind mixed --count 300 --seed $SEED --out fuzz
          ./build/minicplex_bench fuzz --gap 1e-9 --nodes 200000 --quiet --csv cpp_fuzz.csv
          (cd python && python -m minicplex.bench ../fuzz --gap 1e-9 --nodes 200000 --quiet --csv ../py_fuzz.csv)
          python tools/compare_java_cpp.py cpp_fuzz.csv py_fuzz.csv --strict --label Python
