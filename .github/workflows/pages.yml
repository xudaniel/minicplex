name: 网页版 Python 课

# 生成 https://xudaniel.github.io/minicplex/python/ ：课文 + 编辑器 + 在浏览器里运行判分（Pyodide）。
# 每次都先在真浏览器里把 20 课的答案和练习跑一遍，通过了才发布（只有 main 分支发布）。
# 同一个网站还带上 https://xudaniel.github.io/minicplex/hash-fourier/ ：Hash 与傅里叶的互动课和两个游戏厅
# （learning/hash-fourier/ 里的几个单文件网页，核对脚本通过了才复制进去）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 生成网站 + 浏览器里跑全部练习
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 准备工具和 Pyodide（Python 运行时随网站一起发布，打不开 CDN 的地方也能用）
        run: |
          pip install markdown playwright
          python -m playwright install --with-deps chromium
          VERSION=$(sed -n 's/^const VERSION = "\(.*\)";/\1/p' python/tutorial/web/worker.mjs)
          (cd /tmp && npm pack "pyodide@$VERSION" --silent && tar xzf "pyodide-$VERSION.tgz")
      - name: 生成网站
        run: python python/tutorial/make_web.py --out _site --pyodide /tmp/package
      - name: 在浏览器里跑一遍全部练习
        run: |
          (cd _site && python -m http.server 8765 > /dev/null 2>&1 &)
          sleep 1
          python python/tutorial/web/test_site.py http://localhost:8765/python/ _site/python/course.json
          python python/tutorial/web/test_site.py http://localhost:8765/python/en/ _site/python/en/course.json
      - name: 加入 Hash 与傅里叶的互动课和游戏厅（先跑核对脚本）
        run: |
          cd learning/hash-fourier
          node tests/course_test.js course/index.html
          node arcade/test.js arcade/index.html
          node arcade/hash_test.js arcade/hash.html
          mkdir -p ../../_site/hash-fourier/course ../../_site/hash-fourier/arcade
          cp index.html ../../_site/hash-fourier/
          cp course/index.html ../../_site/hash-fourier/course/
          cp arcade/index.html arcade/hash.html ../../_site/hash-fourier/arcade/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: 发布到 GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}python/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
